[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corus-kernel"
version = "0.1.0"
description = "Corus Kernel v0 — derive context from minimal declared objects"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pypdf>=4.0",
]

[project.scripts]
corus-kernel = "corus_kernel.cli:main"
corus-agents = "corus_agents.runner:main"
corus-v1 = "corus_v1.cli:main"
corus-demo-rvo = "demo.rvo_replay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["corus_kernel*", "corus_agents*", "corus_v1*", "demo*", "timpos*", "fasia*"]

[tool.setuptools.package-data]
demo = ["fixtures/rvo/*.yaml", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
