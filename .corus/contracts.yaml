contracts:
  - id: contract.objective_spec
    objective: objective.self_build
    owner: agent.product_strategy
    executor: agent.product_strategy
    consumer: agent.systems_architect
    requires: []
    produces: artifact.objective_spec

  - id: contract.architecture_spec
    objective: objective.self_build
    owner: agent.product_strategy
    executor: agent.systems_architect
    consumer: agent.ui_ux
    requires:
      - artifact.objective_spec
    produces: artifact.architecture_spec

  - id: contract.reducer_implementation
    objective: objective.self_build
    owner: agent.systems_architect
    executor: agent.systems_architect
    consumer: agent.ui_ux
    requires:
      - artifact.architecture_spec
    produces: artifact.reducer_implementation

  - id: contract.surface_rendering
    objective: objective.self_build
    owner: agent.product_strategy
    executor: agent.ui_ux
    consumer: agent.product_strategy
    requires:
      - artifact.reducer_implementation
    produces: artifact.surface_rendering
