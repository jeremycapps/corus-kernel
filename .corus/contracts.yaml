contracts:
  - id: contract.objective_spec
    executor: agent.product_strategy
    consumer: agent.systems_architect
    produces:
      - artifact.objective_spec

  - id: contract.agent_execution_instructions
    executor: agent.product_strategy
    consumer: agent.systems_engineer
    produces:
      - artifact.agent_execution_instructions

  - id: contract.object_model_spec
    executor: agent.systems_architect
    consumer: agent.ui_ux
    produces:
      - artifact.object_model_spec

  - id: contract.reducer_spec
    executor: agent.systems_architect
    consumer: agent.systems_engineer
    produces:
      - artifact.reducer_spec

  - id: contract.runtime_status_update
    executor: agent.systems_engineer
    consumer: agent.product_strategy
    produces:
      - artifact.runtime_status_update

  - id: contract.work_packet_render
    executor: agent.ui_ux
    consumer: agent.product_strategy
    produces:
      - artifact.work_packet_render

  - id: contract.test_suite
    executor: agent.systems_engineer
    consumer: agent.product_strategy
    produces:
      - artifact.test_suite
