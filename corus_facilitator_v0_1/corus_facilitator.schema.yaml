version: corus_facilitator_v0_1

keeper:
  - Origin anchors source reality.
  - WorkItem anchors the unit of work.
  - Projections preserve execution and meaning without bloating the WorkItem.
  - Same Origin. Same WorkItem. Different projections.

architecture:
  chain:
    - Origin
    - WorkItem
    - ExecutionProjection
    - MeaningProjection
    - Requirement
    - Surface
    - Outcome
    - Memory
  diagram: |
    Origin
    -> WorkItem
        -> ExecutionProjection: how / what
        -> MeaningProjection: why / whom
    -> Requirement
    -> Surface
    -> Outcome
    -> Memory

objects:
  origin:
    definition: Minimum auditable source span from which a WorkItem and its projections can be derived.
    preserves:
      - source grounding
      - situated force
      - auditability
      - minimum viable context
    excludes:
      - derived tasks
      - status
      - requirements
      - routing
      - outcomes
      - interpretive notes unless present in the source
    required_fields:
      id: string
      source_ref: string
      source_span: string | null
      evidence: string
    validity_tests:
      - It is a direct source span or locator, not a summary.
      - It is small enough to audit.
      - It is large enough to derive one WorkItem.
      - It can derive both ExecutionProjection and MeaningProjection.

  work_item:
    definition: Derived unit of work anchored to an Origin. It identifies the thing being resolved and carries current state.
    preserves:
      - unit of work
      - provenance to Origin
      - current status
      - resolvable question
    excludes:
      - how
      - what
      - why
      - whom
      - proof requirements
      - authority requirements
      - surface routing
      - outcome evidence
      - memory notes
    required_fields:
      id: string
      origin_id: string
      question: string
      status: open | closed
    validity_tests:
      - It references exactly one Origin.
      - It is phrased as a closure-testable question.
      - It is not a broad topic or generic task title.

  execution_projection:
    definition: Execution reading of the WorkItem.
    preserves:
      - how the WorkItem resolves
      - what is being resolved
    excludes:
      - why it matters
      - whom it matters to
      - proof and authority structure
    required_fields:
      work_item_id: string
      how: string
      what: string
    validity_tests:
      - It references one WorkItem.
      - It derives from the same Origin as the WorkItem.
      - It answers how and what.

  meaning_projection:
    definition: Meaning reading of the same WorkItem.
    preserves:
      - why the WorkItem matters
      - whom it matters to
    excludes:
      - task mechanics
      - routing
      - outcome status
    required_fields:
      work_item_id: string
      why: string
      whom: list[string]
    validity_tests:
      - It references one WorkItem.
      - It derives from the same Origin as the WorkItem.
      - It answers why and whom.

  requirement:
    definition: What must be true for the WorkItem to resolve.
    preserves:
      - satisfaction conditions
      - proof needed
      - authority needed
    excludes:
      - current WorkItem status
      - where resolution happens
      - outcome result
    required_fields:
      work_item_id: string
      proof:
        any: list[string]
        all: list[string]
        none: boolean
      authority:
        any: list[string]
        all: list[string]
        none: boolean
    validity_tests:
      - It references one WorkItem.
      - It names proof only when evidence would satisfy the WorkItem.
      - It names authority only when a person or role must decide.

  surface:
    definition: Smallest adequate venue where resolution can happen.
    preserves:
      - resolution venue
      - routing discipline
      - smallest adequate surface
    excludes:
      - department labels
      - meeting titles
      - org structure
      - proof details
      - status
    required_fields:
      work_item_id: string
      type: async | one_on_one | meeting_with_people
    validity_tests:
      - It references one WorkItem.
      - It uses only an allowed v0.1 surface type.
      - It selects the smallest adequate venue.

  outcome:
    definition: State transition that happened to the WorkItem.
    preserves:
      - what happened
      - state transition
      - evidence supporting the transition
    excludes:
      - current canonical WorkItem state beyond the transition
      - full transcript summary
      - future routing unless directly relevant
    required_fields:
      work_item_id: string
      result: created | resolved | blocked | moved | carried_over | reopened
      evidence: list[string]
    validity_tests:
      - It references one WorkItem.
      - It names one allowed result.
      - It includes evidence when the source supports a transition.

  memory:
    definition: Persistent continuity of the WorkItem across time.
    preserves:
      - first seen
      - last seen
      - source references
      - outcome history
      - concise continuity notes
    excludes:
      - full meeting notes
      - raw transcript unless referenced
      - duplicate primitive definitions
    required_fields:
      work_item_id: string
      first_seen: string | null
      last_seen: string | null
      outcomes: list[string]
      source_refs: list[string]
      notes: string | null
    validity_tests:
      - It references one WorkItem.
      - It preserves continuity without summarizing the whole source.

allowed_values:
  work_item_status:
    - open
    - closed
  surface_type:
    - async
    - one_on_one
    - meeting_with_people
  outcome_result:
    - created
    - resolved
    - blocked
    - moved
    - carried_over
    - reopened

output_shape:
  origins: []
  work_items: []
  execution_projections: []
  meaning_projections: []
  requirements: []
  surfaces: []
  outcomes: []
  memory: []
